<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistani Art & Craft - Etsy Style</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #d1512d; }
        .product-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; width: 250px; padding: 15px; box-shadow: 2px 2px 10px rgba(0,0,0,0.05); text-align: left; }
        .product-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .product-price { color: #007600; font-size: 16px; font-weight: bold; }
        .product-category { background: #eef2ff; color: #4f46e5; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🛒 پاکستانی آرٹ اینڈ کرافٹ (Etsy Store)</h1>
    <p>ہمارے ہاتھ سے بنے ہوئے بہترین روایتی فن پارے۔</p>

    <div class="product-container" id="products-list">
        <p>پروڈکٹس لوڈ ہو رہی ہیں...</p>
    </div>

    <script>
        // API سے ڈیٹا لا کر سکرین پر دکھانا
        fetch('/products')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('products-list');
                container.innerHTML = ''; // پرانا میسج ہٹا دیں

                if(data.items && data.items.length > 0) {
                    data.items.forEach(product => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">قیمت: ${product.price}</div>
                            <div class="product-category">${product.category}</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p>کوئی پروڈکٹ موجود نہیں ہے۔</p>';
                }
            })
            .catch(error => {
                console.error('Error fetching products:', error);
                document.getElementById('products-list').innerHTML = '<p>ڈیٹا لوڈ کرنے میں خرابی پیش آئی۔</p>';
            });
    </script>

</body>
</html>
